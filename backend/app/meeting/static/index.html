<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>快速录音</title>
  <style>
    :root {
      color-scheme: light dark;
      --ink: CanvasText;
      --muted: GrayText;
      --line: ButtonBorder;
      --card: Canvas;
      --control: ButtonFace;
      --control-ink: ButtonText;
      --focus: Highlight;
      --record: red;
      --record-ink: white;
      --ok: green;
    }
    @supports (color: color-mix(in srgb, red, black)) {
      :root {
        --record: color-mix(in srgb, red 82%, black);
        --ok: color-mix(in srgb, green 62%, black);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --record: color-mix(in srgb, red 78%, white);
          --record-ink: black;
          --ok: color-mix(in srgb, green 70%, white);
        }
      }
    }
    @supports (color: color-mix(in srgb, black, white)) {
      :root {
        --muted: color-mix(in srgb, CanvasText 64%, Canvas);
        --line: color-mix(in srgb, CanvasText 18%, Canvas);
        --card: color-mix(in srgb, CanvasText 6%, Canvas);
        --control: color-mix(in srgb, CanvasText 12%, Canvas);
      }
    }

    html { height: 100%; }
    body {
      margin: 0;
      min-height: 100%;
      display: flex;
      align-items: safe center;
      justify-content: center;
      box-sizing: border-box;
      padding: 24px 16px;
      background: Canvas;
      color: var(--ink);
      font: 13px/20px system-ui, "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    main {
      display: grid;
      justify-items: center;
      gap: 12px;
      width: min(100%, 20rem);
    }
    h1, p { margin: 0; }
    .plugin {
      display: grid;
      gap: 16px;
      box-sizing: border-box;
      width: 100%;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--card);
    }
    .plugin-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    h1 {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      font-size: 18px;
      line-height: 24px;
      font-weight: 600;
    }
    .dot {
      flex: none;
      width: 8px;
      height: 8px;
      border: 1px solid currentColor;
      border-radius: 999px;
      background: currentColor;
      color: var(--muted);
    }
    .plugin[data-state="recording"] .dot { color: var(--record); }
    .plugin[data-state="paused"] .dot { background: transparent; }
    .plugin[data-state="done"] .dot { color: var(--ok); }
    .plugin[data-state="error"] .dot { color: var(--record); }
    .timer {
      flex: none;
      color: var(--muted);
      font-size: 18px;
      line-height: 24px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }
    .status {
      min-height: 16px;
      color: var(--muted);
      font-size: 11px;
      line-height: 16px;
    }
    .status[data-state="recording"] { color: var(--ink); }
    .status[data-state="done"] { color: var(--ok); }
    .status[data-state="error"] { color: var(--record); }
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
    }
    button {
      position: relative;
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--control);
      color: var(--control-ink);
      cursor: pointer;
    }
    button svg {
      width: 16px;
      height: 16px;
      display: block;
    }
    button.record {
      background: var(--record);
      color: var(--record-ink);
      border-color: transparent;
    }
    button:hover:not(:disabled):not([aria-disabled="true"]) {
      background: color-mix(in srgb, var(--control) 78%, CanvasText);
    }
    button.record:hover:not(:disabled):not([aria-disabled="true"]) {
      background: color-mix(in srgb, var(--record) 86%, CanvasText);
    }
    button[aria-pressed="true"]:not(.record) {
      background: CanvasText;
      color: Canvas;
      border-color: transparent;
    }
    button.record[aria-pressed="true"]::after,
    button.record[data-phase="paused"]::after {
      content: "";
      position: absolute;
      inset: -6px;
      border: 2px solid color-mix(in srgb, var(--record) 55%, transparent);
      border-radius: inherit;
      pointer-events: none;
    }
    button:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 3px;
    }
    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    button.record[data-phase="live"],
    button.record[data-phase="paused"] {
      opacity: 1;
    }
    button[aria-busy="true"] { cursor: progress; }
    .note {
      color: var(--muted);
      font-size: 11px;
      line-height: 16px;
      text-align: center;
    }
    @media (prefers-reduced-motion: no-preference) {
      button { transition: transform 160ms ease-out; }
      button:active:not(:disabled):not([aria-disabled="true"]) { transform: scale(0.97); }
      button.record[aria-pressed="true"]::after {
        animation: live-ring 1.4s ease-out infinite;
      }
    }
    @keyframes live-ring {
      from { opacity: 0.9; }
      to { opacity: 0.25; }
    }
    @media (pointer: coarse) {
      button { width: 44px; height: 44px; }
    }
    @media (forced-colors: active) {
      .plugin { border: 1px solid CanvasText; }
      button {
        border: 1px solid ButtonText;
        background: ButtonFace;
        color: ButtonText;
        opacity: 1;
      }
      button.record {
        background: ButtonText;
        color: ButtonFace;
      }
      button:disabled {
        color: GrayText;
        border-color: GrayText;
      }
      button.record[aria-pressed="true"]::after,
      button.record[data-phase="paused"]::after {
        border-color: Highlight;
      }
      .dot, .status[data-state="done"], .status[data-state="error"] {
        color: CanvasText;
      }
    }
  </style>
</head>
<body>
  <main>
    <article class="plugin" id="plugin" data-state="idle" aria-labelledby="plugin-title">
      <div class="plugin-head">
        <h1 id="plugin-title">
          <span class="dot" aria-hidden="true"></span>
          快速录音
        </h1>
        <p class="timer"><time id="timer" datetime="PT0M0S" aria-hidden="true">00:00</time></p>
      </div>
      <p id="status" class="status" role="status" aria-live="polite" data-state="idle">待命</p>
      <div class="controls" role="group" aria-label="录音控制">
        <button type="button" id="record" class="record" data-phase="idle" aria-pressed="false" aria-disabled="false" aria-label="开始录音" aria-describedby="status">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="4.5" fill="currentColor" />
          </svg>
        </button>
        <button type="button" id="pause" aria-pressed="false" aria-label="暂停" aria-describedby="status" disabled>
          <svg class="icon-pause" viewBox="0 0 16 16" aria-hidden="true">
            <rect x="4" y="3" width="2.5" height="10" rx="0.5" fill="currentColor" />
            <rect x="9.5" y="3" width="2.5" height="10" rx="0.5" fill="currentColor" />
          </svg>
          <svg class="icon-resume" viewBox="0 0 16 16" aria-hidden="true" hidden>
            <path d="M6 3.8v8.4L12.2 8 6 3.8z" fill="currentColor" />
          </svg>
        </button>
        <button type="button" id="stop" aria-label="停止" aria-describedby="status" disabled>
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <rect x="4.5" y="4.5" width="7" height="7" rx="1" fill="currentColor" />
          </svg>
        </button>
      </div>
    </article>
    <p class="note">只负责录音。纪要与飞书仍通过接口处理。</p>
  </main>
  <script>
    const base = window.location.pathname.replace(/\/ui\/?$/, "");
    const liveMimeCandidates = [
      "audio/ogg;codecs=opus",
      "audio/ogg",
      "audio/mp4",
      "audio/webm;codecs=opus",
      "audio/webm",
    ];
    const state = {
      id: null,
      recorder: null,
      stream: null,
      chunks: [],
      mime: "",
      paused: false,
      pendingBlob: null,
      pendingName: "",
      busy: false,
      elapsedMs: 0,
      segmentStart: 0,
      elapsedTimer: 0,
      mode: "idle",
    };

    const pluginEl = document.getElementById("plugin");
    const statusEl = document.getElementById("status");
    const timerEl = document.getElementById("timer");
    const recordEl = document.getElementById("record");
    const pauseEl = document.getElementById("pause");
    const stopEl = document.getElementById("stop");
    const pauseIcon = pauseEl.querySelector(".icon-pause");
    const resumeIcon = pauseEl.querySelector(".icon-resume");

    function unwrap(body) {
      if (!body || typeof body !== "object") return { error: "", message: "" };
      const detail = body.detail && typeof body.detail === "object" && !Array.isArray(body.detail)
        ? body.detail
        : body;
      return {
        error: typeof detail.error === "string" ? detail.error : "",
        message: typeof detail.message === "string" ? detail.message : "",
      };
    }

    function shortProblem(result) {
      const info = unwrap(result.body);
      if (info.error === "empty_audio") return "没有收到音频";
      if (info.error === "conflict") return "当前不能开始录音";
      if (!result.status) return "网络请求失败";
      return "请求失败";
    }

    async function api(path, options) {
      try {
        const response = await fetch(base + path, {
          headers: { "Content-Type": "application/json" },
          ...options,
        });
        const body = await response.json().catch(() => ({}));
        return { ok: response.ok, status: response.status, body };
      } catch (err) {
        return { ok: false, status: 0, body: { detail: { message: "网络请求失败" } } };
      }
    }

    function setStatus(text, mode) {
      state.mode = mode || "idle";
      const shown = state.mode === "uploading" || state.mode === "requesting" ? "idle" : state.mode;
      statusEl.textContent = text;
      statusEl.dataset.state = state.mode === "error" ? "error" : shown;
      pluginEl.dataset.state = shown;
    }

    function paintElapsed() {
      const extra = state.segmentStart ? Date.now() - state.segmentStart : 0;
      const total = Math.max(0, Math.floor((state.elapsedMs + extra) / 1000));
      const hours = Math.floor(total / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const seconds = total % 60;
      const mm = String(minutes).padStart(2, "0");
      const ss = String(seconds).padStart(2, "0");
      timerEl.textContent = hours > 0 ? hours + ":" + mm + ":" + ss : mm + ":" + ss;
      timerEl.dateTime = "PT" + (hours ? hours + "H" : "") + minutes + "M" + seconds + "S";
    }

    function resetElapsed() {
      state.elapsedMs = 0;
      state.segmentStart = 0;
      if (state.elapsedTimer) window.clearInterval(state.elapsedTimer);
      state.elapsedTimer = 0;
      paintElapsed();
    }

    function startElapsed() {
      state.segmentStart = Date.now();
      paintElapsed();
      if (state.elapsedTimer) window.clearInterval(state.elapsedTimer);
      state.elapsedTimer = window.setInterval(paintElapsed, 250);
    }

    function pauseElapsed() {
      if (state.segmentStart) {
        state.elapsedMs += Date.now() - state.segmentStart;
        state.segmentStart = 0;
      }
      if (state.elapsedTimer) window.clearInterval(state.elapsedTimer);
      state.elapsedTimer = 0;
      paintElapsed();
    }

    function syncControls() {
      const live = Boolean(state.recorder) && !state.paused;
      const paused = Boolean(state.recorder) && state.paused;
      const retry = Boolean(state.pendingBlob);
      const busy = state.busy;
      recordEl.disabled = busy || paused || retry;
      recordEl.dataset.phase = live ? "live" : paused ? "paused" : "idle";
      if (live) {
        recordEl.disabled = false;
        recordEl.setAttribute("aria-disabled", "true");
        recordEl.setAttribute("aria-pressed", "true");
        recordEl.setAttribute("aria-label", "录音中");
      } else {
        recordEl.setAttribute("aria-disabled", "false");
        recordEl.setAttribute("aria-pressed", "false");
        recordEl.setAttribute("aria-label", "开始录音");
      }
      pauseEl.disabled = busy || (!live && !paused);
      pauseEl.setAttribute("aria-pressed", paused ? "true" : "false");
      pauseEl.setAttribute("aria-label", paused ? "继续" : "暂停");
      pauseIcon.hidden = paused;
      resumeIcon.hidden = !paused;
      stopEl.disabled = busy || (!live && !paused && !retry);
      stopEl.setAttribute("aria-busy", busy && (live || paused || retry) ? "true" : "false");
      pluginEl.setAttribute("aria-busy", busy ? "true" : "false");
    }

    function stopTracks(stream) {
      if (!stream) return;
      for (const track of stream.getTracks()) track.stop();
    }

    function releaseStream() {
      const stream = state.stream;
      state.stream = null;
      state.recorder = null;
      state.chunks = [];
      state.paused = false;
      stopTracks(stream);
    }

    function discardCapture() {
      const recorder = state.recorder;
      if (recorder && recorder.state !== "inactive") {
        try { recorder.stop(); } catch (err) { /* already stopped */ }
      }
      releaseStream();
      pauseElapsed();
    }

    function preferredLiveMime() {
      if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return "";
      for (const mime of liveMimeCandidates) {
        if (MediaRecorder.isTypeSupported(mime)) return mime;
      }
      return "";
    }

    function filenameForMime(mime) {
      const kind = String(mime || "").split(";")[0].trim().toLowerCase();
      if (kind === "audio/ogg") return "live-recording.ogg";
      if (kind === "audio/mp4" || kind === "audio/m4a" || kind === "audio/aac" || kind === "audio/x-m4a") {
        return "live-recording.m4a";
      }
      if (kind === "audio/wav" || kind === "audio/wave" || kind === "audio/x-wav") return "live-recording.wav";
      if (kind === "audio/mpeg" || kind === "audio/mp3") return "live-recording.mp3";
      if (kind === "audio/webm") return "live-recording.webm";
      return "live-recording.webm";
    }

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const dataUrl = String(reader.result || "");
          const comma = dataUrl.indexOf(",");
          resolve(comma >= 0 ? dataUrl.slice(comma + 1) : dataUrl);
        };
        reader.onerror = () => reject(reader.error || new Error("无法读取音频"));
        reader.readAsDataURL(blob);
      });
    }

    function waitForRecorderStop(recorder) {
      if (!recorder || recorder.state === "inactive") return Promise.resolve();
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => reject(new Error("录音没有停止")), 10000);
        recorder.addEventListener("stop", () => {
          clearTimeout(timer);
          resolve();
        }, { once: true });
        try {
          if (typeof recorder.requestData === "function" && recorder.state !== "inactive") {
            recorder.requestData();
          }
          recorder.stop();
        } catch (err) {
          clearTimeout(timer);
          reject(err);
        }
      });
    }

    function micMessage(err) {
      const name = err && err.name ? err.name : "";
      if (name === "NotAllowedError" || name === "SecurityError") return "请允许使用麦克风";
      if (name === "NotFoundError" || name === "OverconstrainedError") return "没有找到麦克风";
      return "无法使用麦克风";
    }

    async function ensureRun() {
      if (state.id) return "";
      const created = await api("/runs", {
        method: "POST",
        body: JSON.stringify({ title: "快速录音" }),
      });
      if (!created.ok || !created.body || !created.body.id) return shortProblem(created);
      state.id = created.body.id;
      return "";
    }

    async function startRecording() {
      if (state.busy || state.recorder || state.pendingBlob) return;
      if (recordEl.disabled || recordEl.getAttribute("aria-disabled") === "true") return;
      state.busy = true;
      syncControls();
      let stream = null;
      try {
        setStatus("正在准备", "requesting");
        const prepareError = await ensureRun();
        if (prepareError) {
          setStatus(prepareError, "error");
          return;
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
          setStatus("此浏览器无法使用麦克风", "error");
          return;
        }
        setStatus("正在请求麦克风", "requesting");
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const mime = preferredLiveMime();
        const recorder = mime
          ? new MediaRecorder(stream, { mimeType: mime })
          : new MediaRecorder(stream);
        const chunks = [];
        recorder.addEventListener("dataavailable", (event) => {
          if (event.data && event.data.size > 0) chunks.push(event.data);
        });
        recorder.start(1000);
        state.stream = stream;
        state.recorder = recorder;
        state.chunks = chunks;
        state.mime = recorder.mimeType || mime;
        state.paused = false;
        stream = null;
        const started = await api("/runs/" + state.id + "/live/start", { method: "POST" });
        if (!started.ok) {
          discardCapture();
          setStatus(shortProblem(started), "error");
          return;
        }
        resetElapsed();
        startElapsed();
        setStatus("录音中", "recording");
      } catch (err) {
        const captureStarted = Boolean(state.recorder);
        if (stream) stopTracks(stream);
        discardCapture();
        if (captureStarted) state.id = null;
        setStatus(micMessage(err), "error");
      } finally {
        state.busy = false;
        syncControls();
      }
    }

    function togglePause() {
      const recorder = state.recorder;
      if (!recorder || state.busy || pauseEl.disabled) return;
      try {
        if (!state.paused) {
          if (typeof recorder.pause !== "function" || recorder.state !== "recording") {
            setStatus("无法暂停", "error");
            return;
          }
          recorder.pause();
          state.paused = true;
          pauseElapsed();
          setStatus("已暂停", "paused");
        } else {
          if (typeof recorder.resume !== "function") {
            setStatus("无法继续", "error");
            return;
          }
          recorder.resume();
          state.paused = false;
          startElapsed();
          setStatus("录音中", "recording");
        }
      } catch (err) {
        setStatus(state.paused ? "无法继续" : "无法暂停", "error");
      } finally {
        syncControls();
      }
    }

    async function stopRecording() {
      if (state.busy || stopEl.disabled) return;
      if (!state.recorder && !state.pendingBlob) return;
      state.busy = true;
      syncControls();
      try {
        if (state.recorder) {
          const recorder = state.recorder;
          const chunks = state.chunks;
          const mime = state.mime || recorder.mimeType || "audio/webm";
          await waitForRecorderStop(recorder);
          state.pendingBlob = new Blob(chunks, { type: mime });
          state.pendingName = filenameForMime(mime);
          releaseStream();
          pauseElapsed();
        }
        if (!state.id) {
          state.pendingBlob = null;
          state.pendingName = "";
          setStatus("无法停止录音", "error");
          return;
        }
        if (!state.pendingBlob || state.pendingBlob.size === 0) {
          state.pendingBlob = null;
          state.pendingName = "";
          state.id = null;
          setStatus("没有录到声音", "error");
          return;
        }
        setStatus("正在上传", "uploading");
        const contentBase64 = await blobToBase64(state.pendingBlob);
        const result = await api("/runs/" + state.id + "/live/stop", {
          method: "POST",
          body: JSON.stringify({
            filename: state.pendingName,
            content_base64: contentBase64,
          }),
        });
        if (!result.ok) {
          const info = unwrap(result.body);
          if (info.error === "conflict" || result.status === 409) {
            state.pendingBlob = null;
            state.pendingName = "";
            state.id = null;
            setStatus("这次录音已结束，请重新开始", "error");
            return;
          }
          setStatus("上传失败，再点停止重试", "error");
          return;
        }
        state.pendingBlob = null;
        state.pendingName = "";
        state.id = null;
        if (result.body && result.body.status === "failed") {
          setStatus("已上传，处理失败", "error");
          return;
        }
        setStatus("已保存", "done");
      } catch (err) {
        const keep = Boolean(state.pendingBlob);
        if (state.recorder) {
          releaseStream();
          pauseElapsed();
        }
        if (!keep) state.id = null;
        setStatus(keep ? "上传失败，再点停止重试" : "无法停止录音", "error");
      } finally {
        state.busy = false;
        syncControls();
      }
    }

    recordEl.addEventListener("click", () => { startRecording(); });
    pauseEl.addEventListener("click", () => { togglePause(); });
    stopEl.addEventListener("click", () => { stopRecording(); });

    window.addEventListener("pagehide", () => {
      pauseElapsed();
      stopTracks(state.stream);
    });

    resetElapsed();
    setStatus("待命", "idle");
    syncControls();
  </script>
</body>
</html>
